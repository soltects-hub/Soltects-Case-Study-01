<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="presentation" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="skyFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2b2a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1c2b2a" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="roofFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3f3d"/>
      <stop offset="100%" stop-color="#1c2b2a"/>
    </linearGradient>
  </defs>

  <!-- storm streaks -->
  <g stroke="#f7f4ee" stroke-opacity="0.08" stroke-width="2">
    <line x1="120" y1="40" x2="60" y2="180"/>
    <line x1="260" y1="20" x2="200" y2="160"/>
    <line x1="980" y1="60" x2="920" y2="210"/>
    <line x1="1120" y1="30" x2="1060" y2="170"/>
    <line x1="700" y1="10" x2="650" y2="130"/>
  </g>

  <!-- rooflines (skyline of peaked roofs) -->
  <g fill="url(#roofFill)">
    <polygon points="0,560 160,420 320,560"/>
    <polygon points="260,560 430,400 600,560"/>
    <polygon points="560,560 700,460 840,560"/>
    <polygon points="780,560 960,380 1140,560"/>
    <polygon points="1040,560 1200,440 1200,560"/>
  </g>

  <!-- brick accent chimneys / ridge lines -->
  <g stroke="#c1552e" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="160" y1="420" x2="160" y2="470"/>
    <line x1="430" y1="400" x2="430" y2="455"/>
    <line x1="960" y1="380" x2="960" y2="440"/>
  </g>

  <!-- ground / foreground fade -->
  <rect x="0" y="540" width="1200" height="260" fill="#14201f"/>
  <rect x="0" y="0" width="1200" height="800" fill="url(#skyFade)"/>

  <!-- fine grain dots for texture, kept very subtle -->
  <g fill="#f7f4ee" opacity="0.05">
    <circle cx="90" cy="100" r="2"/><circle cx="220" cy="240" r="2"/><circle cx="500" cy="90" r="2"/>
    <circle cx="760" cy="200" r="2"/><circle cx="1000" cy="120" r="2"/><circle cx="1150" cy="260" r="2"/>
  </g>
</svg>
